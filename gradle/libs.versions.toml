[versions]
quarkus = "3.40.1"
assertj = "3.27.7"
junit = "6.1.3"

[libraries]
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-picocli = { module = "io.quarkus:quarkus-picocli" }
quarkus-logging-json = { module = "io.quarkus:quarkus-logging-json" }
quarkus-config-yaml = { module = "io.quarkus:quarkus-config-yaml" }
quarkus-junit = { module = "io.quarkus:quarkus-junit" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
