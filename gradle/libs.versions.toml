[versions]
quarkus = "3.40.1"
assertj = "3.27.7"
junit = "6.1.3"
pdfbox = "3.0.8"
poi = "5.5.1"
jackson = "2.21.7"
tess4j = "5.20.0"
langchain4j = "1.22.0"
wiremock = "3.13.2"
json-schema-validator = "2.0.8"

[libraries]
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-picocli = { module = "io.quarkus:quarkus-picocli" }
quarkus-logging-json = { module = "io.quarkus:quarkus-logging-json" }
quarkus-config-yaml = { module = "io.quarkus:quarkus-config-yaml" }
quarkus-junit = { module = "io.quarkus:quarkus-junit" }
log4j2-jboss-logmanager = { module = "org.jboss.logmanager:log4j2-jboss-logmanager" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
langchain4j-ollama = { module = "dev.langchain4j:langchain4j-ollama", version.ref = "langchain4j" }
wiremock = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
tess4j = { module = "net.sourceforge.tess4j:tess4j", version.ref = "tess4j" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
quarkus = { id = "io.quarkus", version.ref = "quarkus" }
