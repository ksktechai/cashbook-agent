name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'
      # OCR tests read a scanned synthetic document. Tess4J loads libtesseract.so and libleptonica.so by
      # their unversioned names, which Ubuntu only ships in the -dev packages.
      - name: Install Tesseract
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng libtesseract-dev libleptonica-dev
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build
